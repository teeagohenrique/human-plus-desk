name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validar dependências (pip-audit)
        run: pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app.py src tests

      - name: Compilar
        run: python -m compileall -q app.py src tests

      - name: Testes + cobertura
        run: python -m pytest -q --cov=src --cov-report=term-missing

      - name: Tipos (mypy, baseline)
        run: mypy src --ignore-missing-imports

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "human-plus-desk"
version = "0.1.0"
description = "Assistente de service desk: máscara LGPD, triage, percepção, redação guiada por IA e painel de análise."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name = "Human + Desk"}]

dependencies = [
    "pydantic>=2.0,<3.0",
    "pandas>=2.0,<3.0",
    "streamlit>=1.40,<2.0",
    "altair>=5.0,<7.0",
    "google-genai>=3.6,<4.0",
    "presidio-analyzer>=2.2,<3.0",
    "spacy>=3.8,<3.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17",
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "pip-audit>=2.9",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
]

# Fase 2: substituir este console script pela entrada consolidada da CLI
# (ex.: human-plus-desk = "src.main:main"). O MVP mantém `python -m src.main`.
[project.scripts]

[tool.setuptools]
packages = {find = {where = ["src"]}}

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["__pycache__", "*.egg-info", "dist", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "SIM", "UP", "RUF046", "FURB"]
per-file-ignores = { "src/llm.py" = ["BLE001"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --cov=src --cov-report=term-missing"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
